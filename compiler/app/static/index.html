
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Code Compiler</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Python Code Compiler</h1>
        <textarea id="codeInput" placeholder="Enter your Python code here..."></textarea>
        <button onclick="compileCode()">Compile & Execute</button>
        <div class="output" id="outputArea"></div>
    </div>

    <script>
        async function compileCode() {
            const code = document.getElementById('codeInput').value.trim();
            
            if (!code) {
                alert('Please enter some Python code.');
                return;
            }
            
            const response = await fetch('/compile/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ code: code }),
            });
            
            if (!response.ok) {
                const errorMessage = `Failed to compile and execute code. Status: ${response.status}`;
                console.error(errorMessage);
                document.getElementById('outputArea').innerText = errorMessage;
                return;
            }
            
            const data = await response.json();
            document.getElementById('outputArea').innerText = data.output;
        }
    </script>
</body>
</html>
